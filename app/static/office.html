<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boarders Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237c8cff'/%3E%3Crect x='3' y='3' width='2.5' height='10' rx='.8' fill='%230b0d12'/%3E%3Crect x='6.75' y='3' width='2.5' height='7' rx='.8' fill='%230b0d12'/%3E%3Crect x='10.5' y='3' width='2.5' height='4' rx='.8' fill='%230b0d12'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0d12; --text: #e6e9ef; --muted: #6b7489; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { display: flex; flex-direction: column; align-items: center; font-family: "Press Start 2P", monospace; }
.top { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; font-size: 10px; color: var(--muted); }
.top b { color: var(--text); font-weight: normal; }
.top a { color: #7c8cff; text-decoration: none; }
.top .spacer { flex: 1; }
.top .live::before { content: "●"; color: #3ecf8e; margin-right: 6px; }
.top .live.off::before { color: #f26d6d; }
.stage { position: relative; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.tag {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  background: rgba(20,18,32,.82); color: #fff; padding: 3px 5px 2px; border-radius: 3px; border-bottom: 2px solid var(--c);
  transition: opacity .2s;
}
.dialog {
  position: relative; margin-top: 12px; background: #fbf8ef; color: #2a2638; border-radius: 10px;
  border: 4px solid #3a4a6b; box-shadow: inset 0 0 0 3px #a7c0e8, 0 10px 30px rgba(0,0,0,.4);
  padding: 22px 22px 18px; line-height: 2; min-height: 118px; overflow-wrap: anywhere;
}
.dialog .who { position: absolute; top: -14px; left: 16px; background: #3a4a6b; color: #fff; padding: 6px 10px 5px; border-radius: 6px; }
.dialog a.card { color: #4a5bd9; text-decoration: none; }
.dialog a.card:hover { text-decoration: underline; }
.dialog .bar { display: inline-block; vertical-align: middle; width: 120px; height: 10px; border: 2px solid #2a2638; margin: 0 8px; background: #fff; }
.dialog .bar i { display: block; height: 100%; background: #3ecf8e; }
.dialog .dim { color: #8a8498; }
.dialog .more { position: absolute; right: 16px; bottom: 10px; animation: blink 1s steps(2) infinite; }
.dialog .btn { display: inline-block; margin-top: 6px; background: #3a4a6b; color: #fff; padding: 6px 10px 5px; border-radius: 6px; text-decoration: none; }
.dialog .btn:hover { background: #4a5bd9; }
@keyframes blink { 50% { opacity: 0; } }
.note { color: var(--muted); font-size: 8px; margin: 14px 0 20px; text-align: center; line-height: 2; }
</style>
</head>
<body>
<div class="top"><a href="/">◀ Board</a><span>·</span><b>Office</b><span class="spacer"></span><span id="clock"></span><span class="live" id="live">LIVE</span></div>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div id="tags"></div>
  <div class="dialog" id="dialog"></div>
</div>
<div class="note">Click an agent to see what they're doing, or the board on the wall to open it.</div>
<script src="office.js"></script>
</body>
</html>
